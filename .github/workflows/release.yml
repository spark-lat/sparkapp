name: Build Whitegram APK

on:
  push:
    branches: [ rewrite, master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Reset local edits in repo
        run: |
          git checkout -- . || true

      - name: Setup Keystore and API_KEYS
        run: |
          mkdir -p TMessagesProj/config

          # Удаляем старый конфликтный ключ перед генерацией
          rm -f TMessagesProj/config/extera.jks

          # Создаем чистый валидный keystore
          keytool -genkey -v -keystore TMessagesProj/config/extera.jks \
            -alias whitegram -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass password123 -keypass password123 \
            -dname "CN=Whitegram, OU=Dev, O=Whitegram, L=City, S=State, C=US"

          # Создаем файл API_KEYS строго по официальному формату AyuGram
          cat << 'EOF' > API_KEYS
          APP_ID = 39730387
          APP_HASH = "a090390a06b85e20b1fe58e154dad80a"
          MAPS_V2_API = abcdef12345678
          SIGNING_KEY_PASSWORD = password123
          SIGNING_KEY_ALIAS = whitegram
          SIGNING_KEY_STORE_PASSWORD = password123
          EOF

          # Копируем в корень и в TMessagesProj
          cp API_KEYS TMessagesProj/API_KEYS

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleAfatDebug -x lint -x test --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Whitegram-APK
          path: TMessagesProj/build/outputs/apk/afat/debug/*.apk
