name: Build Whitegram APK

on:
  push:
    branches: [ rewrite, master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Print and Fix build.gradle
        run: |
          echo "=== СТРОКИ 65-85 ИЗ TMessagesProj/build.gradle ==="
          sed -n '65,85p' TMessagesProj/build.gradle || true
          
          # Заменяем обращения к отсутствующим переменным на пустые строки в build.gradle
          python3 -c "
          path = 'TMessagesProj/build.gradle'
          with open(path, 'r', encoding='utf-8') as f:
              lines = f.readlines()
          new_lines = []
          for line in lines:
              # Если строка содержит buildConfigField и может передавать null, защищаем ее
              if 'buildConfigField' in line and 'null' not in line:
                  # Предотвращаем передачу null значения в buildConfigField
                  line = line.replace('project.hasProperty', 'true || project.hasProperty')
              new_lines.append(line)
          with open(path, 'w', encoding='utf-8') as f:
              f.writelines(new_lines)
          "

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleAfatDebug -x lint -x test --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Whitegram-APK
          path: TMessagesProj/build/outputs/apk/afat/debug/*.apk
