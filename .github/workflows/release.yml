name: Build Whitegram Fast Inject

on:
  push:
    branches: [ rewrite, master, main ]
  workflow_dispatch:

jobs:
  patch_apk:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Apktool & Uber-Apk-Signer
        run: |
          sudo apt-get update && sudo apt-get install -y wget
          wget -q https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O apktool
          wget -q https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.9.3.jar -O apktool.jar
          chmod +x apktool
          sudo mv apktool apktool.jar /usr/local/bin/
          wget -q https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -O uber-apk-signer.jar

      - name: Download Official AyuGram Base APK
        run: |
          echo "Скачиваем базовый APK..."
          # Получаем ссылку на последний релиз AyuGram arm64
          DOWNLOAD_URL=$(curl -s https://api.github.com/repos/AyuGram/AyuGramAndroid/releases/latest | grep "browser_download_url.*arm64.*\.apk" | head -n 1 | cut -d '"' -f 4)
          if [ -z "$DOWNLOAD_URL" ]; then
            DOWNLOAD_URL=$(curl -s https://api.github.com/repos/AyuGram/AyuGramAndroid/releases/latest | grep "browser_download_url.*\.apk" | head -n 1 | cut -d '"' -f 4)
          fi
          wget -q "$DOWNLOAD_URL" -O base.apk
          ls -lh base.apk

      - name: Decompile and Inject Keys
        run: |
          echo "Распаковываем APK..."
          apktool d base.apk -o unpacked_apk -f

          echo "Подменяем APP_ID и APP_HASH на твои ключи..."
          python3 -c '
          import os, re

          new_id = "39730387"
          new_hash = "a090390a06b85e20b1fe58e154dad80a"

          # Ищем BuildVars во всех smali папках
          found = False
          for root, dirs, files in os.walk("unpacked_apk"):
              for file in files:
                  if file == "BuildVars.smali":
                      path = os.path.join(root, file)
                      print(f"Найден файл: {path}")
                      with open(path, "r", encoding="utf-8") as f:
                          content = f.read()

                      # Патчим APP_ID (int hex или const)
                      hex_id = hex(int(new_id))
                      content = re.sub(r"(\.field public static(?: final)? (?:APP_ID|BUILD_VERSION_STRING|APP_HASH).*?\n)", r"\1", content)
                      content = re.sub(r"(const/16 [vp]\d+, )0x[0-9a-fA-F]+(\s+#\s+.*APP_ID)", rf"\g<1>{hex_id}\2", content)
                      content = re.sub(r"(const [vp]\d+, )0x[0-9a-fA-F]+", rf"\g<1>{hex_id}", content, count=1)
                      content = re.sub(r"(\"([0-9a-f]{32})\")", f"\"{new_hash}\"", content)

                      with open(path, "w", encoding="utf-8") as f:
                          f.write(content)
                      found = True

          # Также патчим strings.xml на случай если ключи в ресурсах
          res_path = "unpacked_apk/res/values/strings.xml"
          if os.path.exists(res_path):
              with open(res_path, "r", encoding="utf-8") as f:
                  res_data = f.read()
              res_data = re.sub(r"(<string name=\"app_id\">).*?(</string>)", rf"\g<1>{new_id}\2", res_data)
              res_data = re.sub(r"(<string name=\"app_hash\">).*?(</string>)", rf"\g<1>{new_hash}\2", res_data)
              with open(res_path, "w", encoding="utf-8") as f:
                  f.write(res_data)
          print("Ключи успешно заменены!")
          '

      - name: Rebuild APK
        run: |
          echo "Собираем APK обратно..."
          apktool b unpacked_apk -o modified.apk --use-aapt2

      - name: Sign APK
        run: |
          echo "Подписываем APK..."
          java -jar uber-apk-signer.jar --apks modified.apk -o output/

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Whitegram-Signed-APK
          path: output/*.apk
