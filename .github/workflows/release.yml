name: Build Whitegram APK

on:
  push:
    branches: [ rewrite, master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply Patch
        run: |
          if [ -f patch.py ]; then
            python patch.py
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Build Configuration
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "APP_ID=2040" >> local.properties
          echo "APP_HASH=b18441a1ff607e10a989891a5462e627" >> local.properties
          echo "AYU_SYNC_URL=https://example.com" >> local.properties
          echo "AYU_SYNC_API_KEY=dummy" >> local.properties

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Debug APK
        env:
          APP_ID: "2040"
          APP_HASH: "b18441a1ff607e10a989891a5462e627"
          AYU_SYNC_URL: "https://example.com"
          AYU_SYNC_API_KEY: "dummy"
        run: ./gradlew assembleAfatDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Whitegram-APK
          path: TMessagesProj/build/outputs/apk/afat/debug/*.apk
