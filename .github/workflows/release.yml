name: Build Whitegram Fast Inject

on:
  push:
    branches: [ rewrite, master, main ]
  workflow_dispatch:

jobs:
  patch_apk:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Download Tools
        run: |
          curl -sL https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -o apktool
          curl -sL https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -o apktool.jar
          chmod +x apktool
          sudo mv apktool apktool.jar /usr/local/bin/
          curl -sL https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -o uber-apk-signer.jar

      - name: Download Official AyuGram Base APK
        run: |
          python3 -c '
          import urllib.request, json, os

          req = urllib.request.Request(
              "https://api.github.com/repos/AyuGram/AyuGramAndroid/releases/latest",
              headers={"User-Agent": "Mozilla/5.0"}
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  data = json.loads(resp.read().decode("utf-8"))
                  url = ""
                  for asset in data.get("assets", []):
                      name = asset.get("name", "")
                      if name.endswith(".apk") and "arm64" in name:
                          url = asset.get("browser_download_url")
                          break
                  if not url:
                      for asset in data.get("assets", []):
                          if asset.get("name", "").endswith(".apk"):
                              url = asset.get("browser_download_url")
                              break
          except Exception as e:
              print("Fallback to direct release asset...", e)
              url = "https://github.com/AyuGram/AyuGramAndroid/releases/download/v10.10.1/AyuGram4A-arm64-v8a-release.apk"

          print(f"Downloading from: {url}")
          urllib.request.urlretrieve(url, "base.apk")
          '
          ls -lh base.apk

      - name: Decompile and Inject Keys
        run: |
          apktool d base.apk -o unpacked_apk -f

          python3 -c '
          import os, re

          new_id = "39730387"
          new_hash = "a090390a06b85e20b1fe58e154dad80a"
          hex_id = hex(int(new_id))

          for root, dirs, files in os.walk("unpacked_apk"):
              for file in files:
                  if file.endswith(".smali") and "BuildVars" in file:
                      path = os.path.join(root, file)
                      print(f"Патчим файл: {path}")
                      with open(path, "r", encoding="utf-8") as f:
                          content = f.read()

                      content = re.sub(r"(const/16 [vp]\d+, )0x[0-9a-fA-F]+", rf"\g<1>{hex_id}", content)
                      content = re.sub(r"(const [vp]\d+, )0x[0-9a-fA-F]+", rf"\g<1>{hex_id}", content)
                      content = re.sub(r"\"[0-9a-fA-F]{32}\"", f"\"{new_hash}\"", content)

                      with open(path, "w", encoding="utf-8") as f:
                          f.write(content)

          res_file = "unpacked_apk/res/values/strings.xml"
          if os.path.exists(res_file):
              with open(res_file, "r", encoding="utf-8") as f:
                  data = f.read()
              data = re.sub(r"(<string name=\"app_id\">).*?(</string>)", rf"\g<1>{new_id}\2", data)
              data = re.sub(r"(<string name=\"app_hash\">).*?(</string>)", rf"\g<1>{new_hash}\2", data)
              with open(res_file, "w", encoding="utf-8") as f:
                  f.write(data)
          '

      - name: Rebuild and Sign APK
        run: |
          apktool b unpacked_apk -o modified.apk --use-aapt2
          mkdir -p output
          java -jar uber-apk-signer.jar --apks modified.apk -o output/

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Whitegram-Signed-APK
          path: output/*.apk
