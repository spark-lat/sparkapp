name: Build Whitegram APK

on:
  push:
    branches: [ rewrite, master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Discard broken edits and clean build.gradle
        run: |
          # Возвращаем чистый исходный файл TMessagesProj/build.gradle
          git checkout TMessagesProj/build.gradle || true

      - name: Create API_KEYS file
        run: |
          # Создаем файл API_KEYS, который ждет оригинальный build.gradle
          cat << 'EOF' > API_KEYS
          APP_ID=39730387
          APP_HASH=a090390a06b85e20b1fe58e154dad80a
          MAPS_V2_API=
          EOF
          cp API_KEYS TMessagesProj/API_KEYS || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleAfatDebug -x lint -x test --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Whitegram-APK
          path: TMessagesProj/build/outputs/apk/afat/debug/*.apk
