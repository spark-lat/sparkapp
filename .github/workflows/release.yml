name: Build Whitegram APK

on:
  push:
    branches: [ rewrite, master, main ]
  workflow_dispatch:

env:
  APP_ID: "39730387"
  APP_HASH: "a090390a06b85e20b1fe58e154dad80a"
  API_ID: "39730387"
  API_HASH: "a090390a06b85e20b1fe58e154dad80a"
  AYU_SYNC_URL: "https://example.com"
  AYU_SYNC_API_KEY: "dummy"
  AYU_SYNC_PASSWORD: "dummy"
  BOT_TOKEN: "dummy"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup Properties Files with Your Keys
        run: |
          mkdir -p TMessagesProj
          cat << 'EOF' > local.properties
          sdk.dir=/usr/local/lib/android/sdk
          APP_ID=39730387
          APP_HASH=a090390a06b85e20b1fe58e154dad80a
          API_ID=39730387
          API_HASH=a090390a06b85e20b1fe58e154dad80a
          AYU_SYNC_URL=https://example.com
          AYU_SYNC_API_KEY=dummy
          AYU_SYNC_PASSWORD=dummy
          BOT_TOKEN=dummy
          EOF
          cp local.properties TMessagesProj/local.properties
          cp local.properties gradle.properties
          cp local.properties TMessagesProj/gradle.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleAfatDebug \
            -PAPP_ID=39730387 \
            -PAPP_HASH=a090390a06b85e20b1fe58e154dad80a \
            -PAPI_ID=39730387 \
            -PAPI_HASH=a090390a06b85e20b1fe58e154dad80a \
            -PAYU_SYNC_URL="https://example.com" \
            -PAYU_SYNC_API_KEY="dummy" \
            -x lint -x test \
            --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Whitegram-APK
          path: TMessagesProj/build/outputs/apk/afat/debug/*.apk
