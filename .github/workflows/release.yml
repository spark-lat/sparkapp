name: Build Whitegram APK

on:
  push:
    branches: [ rewrite, master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Reset local changes in repo
        run: |
          git checkout -- . || true

      - name: Setup Keystore and API_KEYS
        run: |
          mkdir -p TMessagesProj/config
          rm -f TMessagesProj/config/extera.jks

          keytool -genkey -v -keystore TMessagesProj/config/extera.jks \
            -alias whitegram -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass password -keypass password \
            -dname "CN=Whitegram, OU=Dev, O=Whitegram, L=City, S=State, C=US"

          cat << 'EOF' > API_KEYS
          APP_ID = 39730387
          APP_HASH = "a090390a06b85e20b1fe58e154dad80a"
          MAPS_V2_API = abcdef12345678
          SIGNING_KEY_PASSWORD = password
          SIGNING_KEY_ALIAS = whitegram
          SIGNING_KEY_STORE_PASSWORD = password
          EOF

          cp API_KEYS TMessagesProj/API_KEYS

          cat << 'EOF' >> gradle.properties
          org.gradle.jvmargs=-Xmx6144m -Xss16m -XX:MaxMetaspaceSize=1024m
          org.gradle.parallel=false
          EOF
          cp gradle.properties TMessagesProj/gradle.properties || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build APK (Auto Task Discovery)
        run: |
          # 1. Ищем существующие задачи сборки APK
          TASKS=$(./gradlew tasks --all | grep -E '^([a-zA-Z0-9:]*assemble[a-zA-Z0-9]*)' | awk '{print $1}')
          echo "Доступные таски сборки:"
          echo "$TASKS"

          # 2. Выбираем подходящую таску (afatDebug / debug / afatRelease)
          TARGET_TASK=""
          for t in :TMessagesProj:assembleAfatDebug assembleAfatDebug :TMessagesProj:assembleDebug assembleDebug :TMessagesProj:assembleRelease assembleRelease; do
            if echo "$TASKS" | grep -qx "$t"; then
              TARGET_TASK="$t"
              break
            fi
          done

          if [ -z "$TARGET_TASK" ]; then
            TARGET_TASK=$(echo "$TASKS" | head -n 1)
          fi

          echo "Выбрана таска для сборки: $TARGET_TASK"

          # 3. Запускаем сборку
          ./gradlew $TARGET_TASK -x lint -x test -PbuildServer=true --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Whitegram-APK
          path: TMessagesProj/build/outputs/apk/**/*.apk
